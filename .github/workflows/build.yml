name: Build

on:
  push:
    branches: [develop, improvements]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Linux deps
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package (embeds icon from FyneApp.toml)
        working-directory: cmd
        env:
          CGO_ENABLED: 1
        run: fyne package --target ${{ matrix.target }} --release

      - name: Zip mac app
        if: matrix.target == 'darwin'
        working-directory: cmd
        run: zip -r GoFitsV3-mac.zip GoFitsV3.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoFitsV3-${{ matrix.target }}
          path: |
            cmd/GoFitsV3.exe
            cmd/GoFitsV3.tar.xz
            cmd/GoFitsV3-mac.zip
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cmd/GoFitsV3.exe
            cmd/GoFitsV3.tar.xz
            cmd/GoFitsV3-mac.zip
          fail_on_unmatched_files: false
