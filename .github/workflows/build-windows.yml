name: Build Windows

on:
  push:
    branches: [develop, improvements]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@v2.7.3

      - name: Package (embeds icon from FyneApp.toml)
        working-directory: cmd
        env:
          CGO_ENABLED: 1
        run: fyne package --target windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoFitsV3-windows
          path: cmd/GoFitsV3.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cmd/GoFitsV3.exe
